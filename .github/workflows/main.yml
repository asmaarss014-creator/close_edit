name: Build Dara Helper Tool APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Repository
        uses: actions/checkout@v4


      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"


      - name: Show Java
        run: |
          java -version
          javac -version


      - name: Find Gradle Project
        id: gradle
        shell: bash
        run: |
          set -e

          GRADLEW=$(find . \
            -type f \
            -name "gradlew" \
            -not -path "./.git/*" \
            | head -n 1)

          if [ -z "$GRADLEW" ]; then
            echo "No Gradle wrapper found."
            exit 1
          fi

          PROJECT_DIR="$(dirname "$GRADLEW")"

          echo "Gradle wrapper:"
          echo "$GRADLEW"

          echo "Project directory:"
          echo "$PROJECT_DIR"

          echo "project_dir=$PROJECT_DIR" >> "$GITHUB_OUTPUT"


      - name: Check Gradle Wrapper
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        shell: bash
        run: |
          echo "Checking Gradle wrapper..."

          mkdir -p gradle/wrapper

          if [ ! -f "gradle/wrapper/gradle-wrapper.jar" ]; then
            echo "Gradle wrapper JAR is missing."
            echo "Generating a new Gradle wrapper..."

            if [ -f "gradle/wrapper/gradle-wrapper.properties" ]; then
              cat gradle/wrapper/gradle-wrapper.properties
            fi

            curl -fsSL \
              https://services.gradle.org/distributions/gradle-8.7-bin.zip \
              -o /tmp/gradle.zip

            mkdir -p /tmp/gradle

            unzip -q /tmp/gradle.zip -d /tmp/gradle

            /tmp/gradle/gradle-8.7/bin/gradle wrapper --gradle-version 8.7

          else
            echo "Gradle wrapper JAR exists."
          fi


      - name: Verify Wrapper
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          ls -la gradle/wrapper/
          chmod +x gradlew
          ./gradlew --version


      - name: Build Debug APK
        working-directory: ${{ steps.gradle.outputs.project_dir }}
        run: |
          ./gradlew assembleDebug \
            --stacktrace \
            --no-daemon


      - name: Find APK
        run: |
          echo "Searching for APK..."

          find . \
            -type f \
            -name "*.apk" \
            -not -path "./.git/*" \
            -print


      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: DaraHelperTool-Debug-APK
          path: |
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
